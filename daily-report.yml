name: Begowalia IQ — daily YouTube analysis

on:
  schedule:
    # 08:00 AEST (Brisbane = UTC+10, no daylight savings)
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: begowalia-iq-daily
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build report from YouTube public statistics
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: UCUUhi6u0FzDn2L7mizyog8g
          ARTIST_NAME: Begowalia
        run: python src/report.py
      - name: Save dashboard and daily history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html reports/latest.md data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily YouTube dashboard"
            git push
          fi
